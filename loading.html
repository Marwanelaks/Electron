<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIGRATION</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --dark-bg: #0f0f13;
      --darker-bg: #08080b;
      --accent: #6c5ce7;
      --accent-light: #a29bfe;
      --text: #f5f6fa;
      --text-muted: #b2bec3;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text);
      background-color: var(--dark-bg);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    #cbwrap {
      width: 100%;
      max-width: 1000px;
      /* background: rgba(15, 15, 19, 0.8); */
      backdrop-filter: blur(10px);
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    /* Form elements */
    .form-group {
      margin-bottom: 15px;
    }

    .form-control {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text);
      width: 100%;
      padding: 10px;
      border-radius: 5px;
    }

    .form-control:focus {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent);
      box-shadow: 0 0 0 0.2rem rgba(108, 92, 231, 0.25);
      color: var(--text);
    }

    .input-group {
      display: flex;
      margin-bottom: 15px;
    }

    .input-group-prepend {
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: rgba(108, 92, 231, 0.2);
      border: 1px solid rgba(108, 92, 231, 0.3);
      border-radius: 5px 0 0 5px;
      color: var(--accent-light);
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: 5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border: none;
      font-size: 0.95rem;
      text-align: center;
    }

    .btn-primary {
      background-color: var(--accent);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--accent-light);
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
    }

    /* File upload */
    .uploader {
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 20px 0;
    }

    #file-upload {
      display: none;
    }

    #file-drag {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      text-align: center;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    #file-drag:hover {
      border-color: var(--accent);
      background: rgba(108, 92, 231, 0.1);
    }

    #file-image {
      max-width: 100px;
      margin-bottom: 1rem;
      display: none;
    }

    #start i {
      font-size: 3rem;
      color: var(--accent);
      margin-bottom: 1rem;
    }

    #notimage {
      display: none;
      color: #ff6b6b;
      margin-top: 1rem;
    }

    /* Data table */
    #demoB {
      width: 100%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      margin: 20px 0;
    }

    #demoB th {
      background: rgba(108, 92, 231, 0.2);
      padding: 12px;
      text-align: left;
      position: sticky;
      top: 0;
    }

    #demoB td {
      padding: 10px 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    #demoB tr:nth-child(even) {
      background: rgba(108, 92, 231, 0.05);
    }

    /* Action buttons */
    #suivbtn {
      text-align: right;
      margin-top: 20px;
    }

    .hidden {
      display: none !important;
    }

    /* Blob background */
    .bg-blobs {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      opacity: 0.8;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.2;
      mix-blend-mode: screen;
      transition: all 15s cubic-bezier(0.445, 0.05, 0.55, 0.95);
    }

    .blob-1 {
      background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
      width: 500px;
      height: 500px;
      left: -100px;
      top: -100px;
      animation: float-1 25s infinite alternate;
    }

    .blob-2 {
      background: linear-gradient(135deg, #00b894 0%, #55efc4 100%);
      width: 700px;
      height: 700px;
      right: -150px;
      bottom: -150px;
      animation: float-2 30s infinite alternate;
    }

    @keyframes float-1 {
      0% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(50px, 80px) rotate(180deg); }
      100% { transform: translate(0, 0) rotate(360deg); }
    }

    @keyframes float-2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-80px, -50px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      #cbwrap {
        padding: 15px;
      }

      #demoB th, #demoB td {
        padding: 6px 8px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <!-- Animated Background Blobs -->
  <div class="bg-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div id="cbwrap">
    <form class="my-4">
      <div class="form-group">
        <label for="api-endpoint">API Endpoint</label>
        <div class="input-group">
          <div class="input-group-prepend">POST</div>
          <input type="text" class="form-control" id="api-endpoint" placeholder="https://api.example.com/endpoint">
        </div>
      </div>

      <div class="form-group">
        <label for="apiToken">API Token</label>
        <div class="input-group">
          <div class="input-group-prepend">Bearer</div>
          <input type="text" class="form-control" id="apiToken" placeholder="Your API token">
        </div>
      </div>
    </form>
    
    <form id="file-upload-form" class="uploader">
      <input id="file-upload" type="file" name="fileUpload" accept=".xls,.xlsx" />
    
      <label for="file-upload" id="file-drag">
        <img id="file-image" src="./pngwing.com.png" alt="Preview" class="hidden">
        <div id="start">
          <i class="fa fa-download" aria-hidden="true"></i>
          <div></div>
          <div id="notimage" class="hidden">Please select an Excel File</div>
          <span id="file-upload-btn" class="btn btn-primary">Select a file</span>
        </div>
        <div id="response" class="hidden">
          <div id="messages"></div>
        </div>
      </label>
    </form>

    <div class="table-responsive">
      <table id="demoB"></table>
    </div>

    <div id="suivbtn" class="hidden">
      <button class="btn btn-primary" id="sendDataBtn">
        <i class="fa-solid fa-paper-plane"></i> Start Migration
      </button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
